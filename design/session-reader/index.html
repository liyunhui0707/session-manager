<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>AI Session Manager · 阅读器交互原型</title>
  <link rel="stylesheet" href="prototype.css">
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/></symbol>
    <symbol id="chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="down" viewBox="0 0 24 24"><path d="M12 4v16m-6-6 6 6 6-6"/></symbol>
    <symbol id="up" viewBox="0 0 24 24"><path d="M12 20V4m-6 6 6-6 6 6"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="settings" viewBox="0 0 24 24"><path d="m9 3-.7 2.5-2.2 1L3.7 6 2 9l1.8 1.8v2.4L2 15l1.7 3 2.4-.5 2.2 1L9 21h6l.7-2.5 2.2-1 2.4.5 1.7-3-1.8-1.8v-2.4L22 9l-1.7-3-2.4.5-2.2-1L15 3Z"/><circle cx="12" cy="12" r="3.5"/></symbol>
    <symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></symbol>
    <symbol id="folder" viewBox="0 0 24 24"><path d="M3 7V5h6l2 2h10v12H3Z"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V3H3v13h5"/></symbol>
    <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="moon" viewBox="0 0 24 24"><path d="M20 14A9 9 0 0 1 10 3a9 9 0 1 0 10 11Z"/></symbol>
    <symbol id="monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></symbol>
    <symbol id="refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 1 0 0 8M20 3v5h-5"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="book" viewBox="0 0 24 24"><path d="M12 5C9 3 5 3 2 4v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1Zm0 0v15"/></symbol>
  </defs></svg>
  <div class="prototype-caption"><span>AI Session Manager <span class="caption-divider">/</span> 阅读器设计</span><span>交互原型 · 全部为虚构内容</span></div>
  <div class="app-window">
    <aside class="sidebar" aria-label="会话导航">
      <div class="brand"><span class="brand-mark">≋</span><span>Session Manager<small>每一次对话，都值得回看</small></span></div>
      <button class="search-launch" id="global-search"><svg><use href="#search"/></svg><span>搜索对话</span><kbd>⌘ K</kbd></button>
      <div class="source-tabs" role="group" aria-label="来源筛选"><button class="selected" data-source="all" aria-pressed="true">全部</button><button data-source="Codex" aria-pressed="false">Codex</button><button data-source="Claude" aria-pressed="false">Claude</button></div>
      <div class="list-heading"><span id="list-heading">最近会话</span><button class="icon-button" id="favorites-filter" aria-label="只看收藏" aria-pressed="false" title="只看收藏"><svg><use href="#star"/></svg></button></div>
      <nav id="conversation-list" class="conversation-list" aria-label="活跃会话"></nav>
      <footer class="sidebar-footer"><button id="sources-button" class="source-summary"><span class="live-dot"></span><span>2 个本地来源<small>仅显示活跃会话</small></span><svg><use href="#chevron"/></svg></button><button id="settings-button" class="icon-button" aria-label="设置" title="设置"><svg><use href="#settings"/></svg></button></footer>
    </aside>
    <main class="workspace" id="workspace">
      <header class="reader-header"><div class="reader-heading"><h1 id="conversation-title"></h1><div class="reader-meta" id="conversation-meta"></div></div><div class="header-actions"><button id="favorite-button" class="icon-button" aria-label="收藏会话" title="收藏会话"><svg><use href="#star"/></svg></button><button id="find-button" class="icon-button" aria-label="在当前会话中查找" title="在当前会话中查找 · ⌘ F"><svg><use href="#search"/></svg></button><button id="details-button" class="icon-button" aria-label="会话信息" title="会话信息"><svg><use href="#info"/></svg></button></div></header>
      <div class="find-bar" id="find-bar" hidden><svg><use href="#search"/></svg><input id="find-input" aria-label="查找当前会话" placeholder="查找当前会话…"><span id="find-count" aria-live="polite"></span><button id="find-previous" class="icon-button" aria-label="上一个匹配"><svg><use href="#up"/></svg></button><button id="find-next" class="icon-button" aria-label="下一个匹配"><svg><use href="#down"/></svg></button><button id="find-close" class="icon-button" aria-label="关闭查找"><svg><use href="#close"/></svg></button></div>
      <div class="notice" id="notice" hidden></div>
      <div class="reading-scroll" id="reading-scroll" tabindex="0" aria-label="会话内容"><article id="transcript" class="transcript"></article></div>
      <button class="jump-latest" id="jump-latest" hidden><svg><use href="#down"/></svg><span>回到最新消息</span></button>
      <footer class="reader-footer"><span id="reader-position">已到最新</span><span id="sync-status"><span class="live-dot"></span> 自动同步<span class="footer-dot">·</span>只读</span></footer>
    </main>
  </div>
  <div class="prototype-footer"><span>原型不会访问文件、连接 CLI 或发送聊天内容。</span><button id="scenarios-button">预览其他状态 <svg><use href="#chevron"/></svg></button></div>
  <dialog id="search-dialog" class="search-dialog" aria-labelledby="search-title"><div class="dialog-search"><svg><use href="#search"/></svg><input id="search-input" aria-label="搜索所有对话" placeholder="搜索标题或对话中的任何一句话…" autocomplete="off"><button class="escape" data-close>Esc</button></div><div class="search-toolbar"><h2 id="search-title">所有活跃会话</h2><span id="search-result-count"></span></div><div id="search-results"></div><footer class="dialog-footer">搜索整个会话的提示词与最终回复<span>Enter 打开第一项</span></footer></dialog>
  <dialog id="panel-dialog" class="panel-dialog" aria-labelledby="panel-title"><header class="panel-header"><h2 id="panel-title"></h2><button class="icon-button" data-close aria-label="关闭"><svg><use href="#close"/></svg></button></header><div id="panel-content"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="fixtures.js"></script><script src="prototype.js"></script>
</body>
</html>
